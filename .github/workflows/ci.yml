# CI for the Laocoön action itself: run unit tests and verify the committed
# bundle is up to date with src/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Verify dist/ is up to date with src/
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/index.mjs is stale. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist/
            exit 1
          fi
